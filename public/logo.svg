<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Globe icon -->
  <g transform="translate(20, 12)">
    <!-- Outer circle -->
    <circle cx="20" cy="20" r="18" stroke="#F59E0B" stroke-width="2" fill="none"/>
    <!-- Horizontal line -->
    <ellipse cx="20" cy="20" rx="18" ry="7" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <!-- Vertical line -->
    <line x1="20" y1="2" x2="20" y2="38" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Diagonal lines -->
    <ellipse cx="20" cy="20" rx="12" ry="18" stroke="#F59E0B" stroke-width="1" fill="none" transform="rotate(45, 20, 20)"/>
    <ellipse cx="20" cy="20" rx="12" ry="18" stroke="#F59E0B" stroke-width="1" fill="none" transform="rotate(-45, 20, 20)"/>
    <!-- Cursor arrow -->
    <g transform="translate(32, 8)">
      <path d="M0 0 L12 8 L7 10 L10 16 L7 17 L4 11 L0 14 Z" fill="#F59E0B"/>
    </g>
  </g>
  <!-- WEBZY text -->
  <text x="75" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="3" fill="none" stroke="#9CA3AF" stroke-width="1.5">WEBZY</text>
</svg>
